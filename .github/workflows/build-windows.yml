name: Build Windows Libraries

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/reaction]
    paths:
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Flash repository
        uses: actions/checkout@v4

      - name: Clone ThermoPack source
        run: |
          git clone https://github.com/thermotools/thermopack.git thermopack-src
        shell: bash

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-lapack
            mingw-w64-x86_64-openblas
            make

      - name: Check environment
        shell: msys2 {0}
        run: |
          echo "=== Compiler versions ==="
          which gfortran
          gfortran --version
          which gcc
          gcc --version
          which cmake
          cmake --version

      - name: Build ThermoPack
        shell: msys2 {0}
        run: |
          cd thermopack-src
          mkdir -p build && cd build
          cmake .. -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++
          ninja

      - name: List built files
        shell: bash
        run: |
          echo "=== Build directory ==="
          find thermopack-src/build -name "*.dll" -o -name "*.lib" -o -name "*.a" 2>/dev/null || true
          ls -la thermopack-src/build/ || true

      - name: Check exported symbols
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "thermopack-src/build" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) {
            Write-Host "=== Symbols in $($dll.Name) ==="
            dumpbin /exports $dll.FullName | Select-String "eos" | Select-Object -First 20
          } else {
            Write-Host "No DLL found"
          }

      - name: Upload Windows libraries
        uses: actions/upload-artifact@v4
        with:
          name: thermopack-windows-x64
          path: |
            thermopack-src/build/**/*.dll
            thermopack-src/build/**/*.lib
            thermopack-src/build/**/*.a
          if-no-files-found: warn
