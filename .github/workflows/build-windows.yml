name: Build Windows Libraries

on:
  # 手动触发（任何分支都可以）
  workflow_dispatch:
  # push触发
  push:
    branches: [main, master, feature/reaction]
    paths:
      - 'external/thermopack/**'

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            make

      - name: Check compiler version
        run: |
          gfortran --version
          gcc --version
          cmake --version

      - name: Build ThermoPack
        run: |
          cd external/thermopack
          mkdir -p build && cd build
          cmake .. -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON
          cmake --build . --config Release

      - name: List built files
        run: |
          echo "=== Build directory contents ==="
          ls -la external/thermopack/build/
          echo "=== DLL files ==="
          find external/thermopack/build -name "*.dll" -o -name "*.lib" -o -name "*.a"

      - name: Check exported symbols
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "external/thermopack/build" -Filter "*.dll" -Recurse | Select-Object -First 1
          if ($dll) {
            Write-Host "Checking symbols in: $($dll.FullName)"
            dumpbin /exports $dll.FullName | Select-String "eos" | Select-Object -First 20
          }

      - name: Upload Windows libraries
        uses: actions/upload-artifact@v4
        with:
          name: thermopack-windows-x64
          path: |
            external/thermopack/build/*.dll
            external/thermopack/build/*.lib
            external/thermopack/build/*.a
          if-no-files-found: warn
